openapi: 3.1.0
info:
  title: 資格学習エンジン
  version: 0.1.0
  description: >
    公式過去問の出題・採点・復習・引継ぎを行う学習エンジン。AIアプリは返ってきた内容を表示するだけにする。
    接続版プロンプト（AIアプリ学習開始プロンプト_接続版.md）と組み合わせて使う。
servers:
  - url: https://REPLACE-WITH-CLOUD-RUN-URL
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Source:
      type: object
      required: [adapter, year, section, questionUrl]
      properties:
        adapter: { type: string, enum: [takken, surveyor], description: takken＝宅建、surveyor＝測量士補 }
        year: { type: integer, description: 西暦の試験年度 }
        section: { type: string, description: 区分。分からなければ main }
        questionUrl: { type: string, description: 公式の問題PDFのURL（https） }
        answerUrl: { type: [string, 'null'], description: 同じ年度の公式の正答PDFのURL。問題PDFに正答が入っていれば null }
    Job:
      type: object
      properties:
        state: { type: string, enum: [running, done, failed] }
        notice: { type: [string, 'null'], description: 利用者にそのまま伝える案内文 }
        sources:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              status: { type: string, enum: [pending, done, failed] }
              reason: { type: [string, 'null'] }
              packetCount: { type: [integer, 'null'] }
    Question:
      type: object
      properties:
        questionId: { type: string }
        kind: { type: string, enum: [new, review] }
        year: { type: integer }
        questionNumber: { type: integer }
        stem: { type: string }
        fieldName: { type: [string, 'null'], description: 分野の名前 }
        stemMode: { type: string, enum: [text, ocr, official_image] }
        choices: { type: array, items: { type: string } }
        figures:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              width: { type: integer }
              height: { type: integer }
        questionPdfUrl: { type: string }
        questionPdfPages: { type: array, items: { type: integer } }
        notices: { type: array, items: { type: string } }
paths:
  /v1/sessions:
    post:
      operationId: startSession
      x-openai-isConsequential: false
      summary: 資格の過去問の取り込みを始め、学習セッションを作る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qualificationId, sources]
              properties:
                qualificationId: { type: string, description: q041＝宅建、q063＝測量士補 }
                learnerId: { type: string, description: 引継ぎデータから再開したときだけ、その引継ぎID }
                sources: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/Source' } }
                plan:
                  type: object
                  properties:
                    examDate: { type: string, description: YYYY-MM-DD }
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  learnerId: { type: string, description: 引継ぎID。利用者に必ず伝える（別のチャットやAIで続けるときに使う） }
                  job: { $ref: '#/components/schemas/Job' }
  /v1/sessions/{sessionId}/next:
    post:
      operationId: nextQuestion
      x-openai-isConsequential: false
      summary: 次の問題を受け取る（未回答の問題があれば同じ問題を返す）
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 次の問題、または待ち・終了
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [question, waiting, finished] }
                  repeated: { type: boolean }
                  fieldChanged: { type: boolean, description: 前の問から分野が変わったとき true }
                  fieldNotice: { type: [string, 'null'], description: 分野が変わるときの案内文。問題の前にそのまま表示する }
                  question: { $ref: '#/components/schemas/Question' }
                  notice: { type: [string, 'null'] }
  /v1/sessions/{sessionId}/answer:
    post:
      operationId: submitAnswer
      x-openai-isConsequential: false
      summary: 回答を採点する
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, value]
              properties:
                questionId: { type: string, description: 出題時に受け取った questionId をそのまま }
                value: { type: string, description: 利用者が選んだ選択肢の番号 }
                confidence: { type: string, enum: [sure, guess], description: 勘で選んだと言われたら guess }
      responses:
        '200':
          description: 採点結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  grade:
                    type: object
                    properties:
                      questionId: { type: string }
                      selected: { type: integer }
                      correctAnswer: { type: integer }
                      correct: { type: boolean }
                      result: { type: string, enum: [wrong, guess_correct, confident_correct] }
                      answerPdfUrl: { type: string }
                      alreadyGraded: { type: boolean }
                      wrongStreak: { type: integer, description: 同じ分野で連続して間違えた回数（エンジンが数える） }
                      checkSuggested: { type: boolean, description: true なら、確認問題に切り替えるかを利用者に聞く }
                  next:
                    type: object
                    description: 次の問題（nextQuestion と同じ形）。利用者が次へ進むときに、これを表示する
                    properties:
                      status: { type: string, enum: [question, waiting, finished] }
                      repeated: { type: boolean }
                      fieldChanged: { type: boolean, description: 前の問から分野が変わったとき true }
                      fieldNotice: { type: [string, 'null'], description: 分野が変わるときの案内文。問題の前にそのまま表示する }
                      question: { $ref: '#/components/schemas/Question' }
                      notice: { type: [string, 'null'] }
        '409':
          description: 出題中の問題と違う・番号が範囲外（error に理由コード）
  /v1/sessions/{sessionId}/handoff:
    get:
      operationId: getHandoff
      x-openai-isConsequential: false
      summary: 次のチャットへ引き継ぐデータ（問題本文は含まない）
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 引継ぎデータ
          content:
            application/json:
              schema:
                type: object
                properties:
                  handoff: { type: string }
  /v1/pdf-pages:
    post:
      operationId: renderPdfPages
      x-openai-isConsequential: false
      summary: 公式PDFの問題のページから、表を文字で読み取り、図だけを切り出したPDFファイルをチャットに付ける（エンジンが対応していない資格の図や表を見せるため）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 公式PDFのURL（https） }
                find: { type: string, maxLength: 30, description: 見出しの文字（例：第11問）。これを渡すと、その見出しのあるページから画像にする。ページ番号を推測しないために、まずこちらを使う }
                span: { type: integer, minimum: 1, maximum: 4, description: find のとき、見出しのページから何ページ分返すか（既定2） }
                pages: { type: array, minItems: 1, maxItems: 4, items: { type: integer, minimum: 1 }, description: find を使わないときだけ。PDFの先頭を1ページ目とした番号（本に印刷されたページ番号とは違う） }
      responses:
        '200':
          description: ページ画像
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageCount: { type: [integer, 'null'] }
                  matchedPage: { type: [integer, 'null'] }
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        page: { type: integer }
                        url: { type: string, description: ページ画像のURL（回答には貼らない） }
                  display: { type: [string, 'null'], description: 問題文・図（SVG）・表・選択肢を公式と同じ順に並べた表示。あれば1文字も変えずにそのまま表示する }
                  tables: { type: [string, 'null'], description: 公式PDFから読み取った表（マークダウン）。display が無いときに使う }
                  figureCount: { type: integer, description: 切り出した図の数。1以上なら、問題文と表のあとでPythonを実行し、付いたPDFを画像にして表示する }
                  notice: { type: string, description: 図を表示できなかったときに、利用者にそのまま表示する案内 }
                  openaiFileResponse: { type: array, items: { type: string }, description: チャットに付けるPDFファイル }
        '422':
          description: PDFではない・ページが範囲外（error に理由コード）
  /v1/study/start:
    post:
      operationId: startStudy
      x-openai-isConsequential: false
      summary: 学習の開始を記録する（開始時刻はエンジンが取る）。学習計画を利用者が承認したとき（再開なら『始めます』と答えたとき）に呼ぶ。資格名を聞いた時点では呼ばない
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qualificationName]
              properties:
                qualificationName: { type: string, description: 利用者が言った資格名 }
                learnerId: { type: string, description: startSession の learnerId、または貼られた引継ぎデータの「引継ぎID」 }
      responses:
        '201':
          description: 開始した
          content:
            application/json:
              schema:
                type: object
                properties:
                  studyId: { type: string, description: 終了のとき endStudy に渡す }
                  learnerId: { type: string, description: 引継ぎID。startSession にも渡す }
                  resumed: { type: boolean }
                  startTime: { type: string, description: 開始時刻（日本時間 HH:MM） }
                  totalMinutes: { type: integer, description: これまでの累計学習時間（分） }
                  display: { type: string, description: 利用者にそのまま表示する }
  /v1/study/{studyId}/end:
    post:
      operationId: endStudy
      x-openai-isConsequential: false
      summary: 学習の終了。終了時刻・学習時間・累計をエンジンが確定し、終了ログと引継ぎデータの全文を返す
      parameters:
        - { name: studyId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 今回の学習の中身。分からない項目は省く（エンジンが「記録なし」などと書く）
              properties:
                sessionId: { type: string, description: startSession を使ったときだけ }
                area: { type: string, description: 今回の科目・領域 }
                item: { type: string, description: 今回の項目 }
                purpose: { type: string, description: 今回の目的 }
                studiedAreas: { type: array, items: { type: string } }
                contents: { type: array, items: { type: string }, description: 主な学習内容 }
                results:
                  type: object
                  properties:
                    practiceCorrect: { type: integer, description: 実践問題（過去問）の正解数 }
                    practiceWrong: { type: integer }
                    checkCorrect: { type: integer, description: 確認問題の正解数 }
                    checkWrong: { type: integer }
                    skipped: { type: integer }
                    skippedDetail: { type: string }
                    pendingDetail: { type: string }
                weaknesses: { type: array, items: { type: string }, description: 誤答・弱点（年度と問番号を添える） }
                review: { type: array, items: { type: string }, description: 復習対象 }
                progress:
                  type: object
                  properties:
                    done: { type: string }
                    inProgress: { type: string }
                    notStarted: { type: string }
                    needReview: { type: string }
                    unconfirmed: { type: string }
                    exempt: { type: string }
                nextPriority: { type: array, items: { type: string } }
                nextPurpose: { type: array, items: { type: string } }
                qualification:
                  type: object
                  properties:
                    examYear: { type: string }
                    examDate: { type: string }
                    exemption: { type: string }
                    stage: { type: string }
                    settings: { type: string }
                plan: { type: array, items: { type: string }, description: 試験範囲と学習計画の状態 }
                skippedTopics: { type: array, items: { type: string }, description: 未回答・スキップした問題の論点 }
      responses:
        '200':
          description: 終了ログと引継ぎデータ
          content:
            application/json:
              schema:
                type: object
                properties:
                  minutes: { type: integer }
                  totalMinutes: { type: integer }
                  display: { type: string, description: 終了ログと引継ぎデータの全文。1文字も変えずにそのまま表示する }
  /v1/handoff/import:
    post:
      operationId: importHandoff
      x-openai-isConsequential: false
      summary: 引継ぎデータから学習を再開する（問題は引継ぎIDの保存から読む。公式PDFは取り直さない）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handoff]
              properties:
                handoff: { type: string }
                sources: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/Source' } }
      responses:
        '201':
          description: 再開した
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  restored: { type: integer }
                  withheld:
                    type: array
                    items:
                      type: object
                      properties:
                        questionId: { type: string }
                        reason: { type: string }
                        message: { type: string }
                  job: { $ref: '#/components/schemas/Job' }
  /v1/jobs/{qualificationId}:
    get:
      operationId: getJob
      x-openai-isConsequential: false
      summary: 過去問の取り込みの状況（呼ぶたびに少しずつ進む）
      parameters:
        - { name: qualificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 取り込みの状況
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: '#/components/schemas/Job' }
