name: GPTと同じ呼び出しで、公開中のエンジンを確かめる（測量士補）
# 合図：新システム開発/deploy/gpt-smoke-request.txt を更新して push する。
# GPT「資格学習」が使うAPI（開始→取り込み→出題→採点→学習の終了）を順に呼び、
# 応答の速さ、図の表示（本文中のSVG）、終了ログが出るかを確かめる。合言葉は出さない。
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/gpt-smoke-request.txt'
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 合言葉を読む（表示しない）
        run: |
          t=$(gcloud secrets versions access latest --secret qlp-api-token --project qualification-learning)
          echo "::add-mask::$t"
          echo "QLP_TOKEN=$t" >> "$GITHUB_ENV"
      - run: pip install pymupdf==1.26.5
      - name: 測量士補R8で、開始から終了まで呼ぶ
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          BASE = "https://qlp-engine-ojsw3j46qa-an.a.run.app"
          TOKEN = os.environ["QLP_TOKEN"]
          def call(method, path, body=None):
              t = time.time()
              req = urllib.request.Request(BASE + path, method=method, data=None if body is None else json.dumps(body).encode(),
                                           headers={"authorization": f"Bearer {TOKEN}", "content-type": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=60); code = r.status; data = json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  code = e.code; data = json.loads(e.read() or b"{}")
              print(f"{method} {path} -> {code} ({time.time()-t:.1f}s)")
              return code, data, time.time() - t
          code, st, _ = call("POST", "/v1/study/start", {"qualificationName": "測量士補"})
          lid = st["learnerId"]
          src = [{"adapter": "surveyor", "year": 2026, "section": "main",
                  "questionUrl": "https://web2.gsi.go.jp/common/000278974.pdf", "answerUrl": "https://web2.gsi.go.jp/common/000278975.pdf"}]
          code, j, _ = call("GET", "/v1/jobs/q063")
          assert code == 200 and "nextQuestion" in j.get("hint", "") and "セッション" not in j.get("notice", "") and "session" not in j.get("notice", ""), (code, j)
          code, s, sec = call("POST", "/v1/sessions", {"qualificationId": "q063", "sources": src, "learnerId": lid})
          assert code == 201 and sec < 20, ("開始が遅い・失敗", code, sec, s)
          sid = s["sessionId"]
          years = [x["year"] for x in s["job"]["sources"]]
          print("取り込む年度", years)
          assert len(set(years)) >= 3 and years == sorted(years, reverse=True), ("公式ページの全年度を新しい順に取り込んでいない", years)
          # AIが引継ぎIDを sessionId として送っても出題できる
          code, n, _ = call("POST", f"/v1/sessions/{lid}/next")
          assert code == 200, ("引継ぎIDでの出題が失敗", code, n)
          print("引継ぎIDでの出題 OK", n.get("status"))
          seen, figs = [], 0
          for i in range(80):
              code, n, sec = call("POST", f"/v1/sessions/{sid}/next")
              assert sec < 40, ("出題が遅い", sec)
              if n.get("status") == "waiting":
                  print("  ", n.get("notice")); time.sleep(15); continue
              if n.get("status") != "question":
                  print(json.dumps(n, ensure_ascii=False)[:500]); break
              q = n["question"]
              d = q.get("screen") or ""
              svgs = re.findall(r"<svg.*?</svg>", d, re.S)
              print(f"  {q['year']}年度 問{q['questionNumber']} 図{len(q['figures'])} SVG{len(svgs)} 表示{len(d)}字 選択肢{[c[:12] for c in q['choices']]}")
              assert "原本の画像を開く" not in d, ("問題PDFのリンクが2か所にある", d[:300])
              open(f"out/q{q['questionNumber']}-display.md", "w").write(d)
              for j, svg in enumerate(svgs):
                  import fitz
                  vb = [float(x) for x in re.search(r'viewBox="([^"]+)"', svg).group(1).split()]
                  fixed = svg.replace('width="100%"', f'width="{vb[2]*2}" height="{vb[3]*2}"', 1)
                  fitz.open(stream=fixed.encode(), filetype="svg")[0].get_pixmap(dpi=72).save(f"out/q{q['questionNumber']}-svg{j+1}.png")
              assert "■" in d and q["choices"][0] in d, "screen が無い"
              for link in re.findall(r"\]\((https://[^)]+/v1/figure/[^)]+)\)", d):
                  r = urllib.request.urlopen(link, timeout=30)
                  print("  図のリンク", r.status, r.headers.get("content-type"))
                  assert r.status == 200
              if q["figures"]:
                  figs += 1
              seen.append(q["questionNumber"])
              if len(seen) >= 28 or (figs >= 3 and 21 in seen):
                  break
              # ChatGPTが書き崩した番号で送っても採点される
              code, a, _ = call("POST", f"/v1/sessions/{sid}/answer", {"questionId": f"{q['year']}年 問{q['questionNumber']}", "value": "スキップ" if len(seen) == 1 else 1})
              assert code == 200, a
              assert a["next"].get("question", {}).get("questionId") != q["questionId"], "次の問に進まない"
              if len(seen) == 1: assert a["grade"].get("skipped"), a["grade"]
          assert figs, "図のある問が出なかった"
          code, e, _ = call("POST", f"/v1/study/{lid}/end", {"sessionId": sid})
          assert code == 200, e
          print(e["display"][:600])
          assert "スキップ1問" in e["display"], "スキップが終了ログに出ない"
          # 新しいチャット：GPTが引継ぎデータを要約して渡しても再開できる
          summary = f"前回の学習の引き継ぎです。資格は測量士補。**引き継ぎID：{lid}**。続きから始めたい。"
          code, im, _ = call("POST", "/v1/handoff/import", {"handoff": summary})
          assert code == 201, ("要約した引継ぎデータで再開できない", code, im)
          sid2 = im["sessionId"]
          print("新しいチャットでの再開 OK", im.get("restored"))
          # 問題の指定：2025年度 問13 を出すと、図が付く
          for i in range(20):
              code, n, _ = call("POST", f"/v1/sessions/{sid2}/next", {"question": "2025年度 問13"})
              if n.get("status") == "waiting":
                  print("  ", n.get("notice")); time.sleep(15); continue
              break
          assert code == 200 and n.get("status") == "question", ("問13が出ない", code, json.dumps(n, ensure_ascii=False)[:500])
          q = n["question"]; d = q.get("screen") or ""
          open("out/r7-q13-display.md", "w").write(d)
          print(f"  {q['year']}年度 問{q['questionNumber']} 図{len(q['figures'])} 選択肢{len(q['choices'])}")
          assert (q["year"], q["questionNumber"]) == (2025, 13), ("指定した問が出ない", q["year"], q["questionNumber"])
          assert q["figures"], "問13に図が無い"
          links = re.findall(r"\]\((https://[^)]+/v1/figure/[^)]+)\)", d)
          assert links or "<svg" in d, ("問13の画面に図が無い", d[:500])
          for link in links:
              r = urllib.request.urlopen(link, timeout=30); body = r.read()
              print("  問13の図", r.status, r.headers.get("content-type"), len(body))
              assert r.status == 200 and len(body) > 1000
              open("out/r7-q13-fig.png", "wb").write(body)
          assert q["choices"] and q["choices"][0] in d, "問13の選択肢が画面に無い"
          # 図をもう一度：エンジンが公式の図のファイルを付け直す（AIに画像を探させない）
          code, fa, _ = call("POST", f"/v1/sessions/{sid2}/next", {"question": "2025年度 問13の図をもう一度"})
          print("  図をもう一度", fa.get("status"), fa.get("figureCount"), (fa.get("screen") or "")[:60])
          assert code == 200 and fa.get("status") == "figure" and fa.get("openaiFileResponse"), ("図をもう一度が返らない", code, fa)
          code, g, _ = call("POST", "/v1/pdf-pages", {"url": src[0]["questionUrl"], "find": "No. 26"})
          assert code == 409 and g.get("error") == "ENGINE_QUESTION", (code, g)
          print("OK", seen)
          PY
      - name: 結果を gpt-smoke ブランチに置く
        if: always()
        run: |
          cd out
          git init -q -b gpt-smoke
          git config user.name smoke; git config user.email smoke@example.invalid
          git add -A; git commit -qm "gpt smoke" --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gpt-smoke
