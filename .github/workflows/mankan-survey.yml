name: マンション管理士の公式過去問ページを調べる（開発用・読み取りのみ）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/parser/tools/mankan_survey.py'
      - '.github/workflows/mankan-survey.yml'
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r 新システム開発/parser/requirements.txt
      - run: python 新システム開発/parser/tools/mankan_survey.py
