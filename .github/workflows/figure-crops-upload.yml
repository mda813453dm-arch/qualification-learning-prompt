name: 図表だけの切り出し画像を Cloud Storage に置く
# 合図：新システム開発/deploy/figure-crops-request.txt を更新して push する。
# figure-crops ブランチの画像（目視確認した範囲を公式PDFから切り出したもの）を、manifest.json の SHA-256 を確かめてから
# gs://qualification-learning-qlp-figures/fig/own/_shared/<PDFのSHA>/<版>/<ファイル> に置く。
# 既にある画像は上書きしない（-n）。Firestore の問題データ・学習履歴には触れない。有料APIは呼ばない。
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/figure-crops-request.txt'
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
    steps:
      - uses: actions/checkout@v4
        with: { ref: figure-crops, path: crops }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: SHA-256 を確かめる
        run: |
          cd crops
          python3 - <<'PY'
          import hashlib, json
          m = json.load(open('manifest.json'))
          for x in m:
              assert hashlib.sha256(open(x['path'], 'rb').read()).hexdigest() == x['sha256'], x['path']
              assert x['key'].startswith('fig/own/_shared/') and x['key'].endswith('/' + x['path'].split('/')[-1]), x['key']
          print('OK', len(m))
          PY
      - name: 置く（上書きしない・並列）
        run: |
          cd crops
          # バケット上の配置どおりのフォルダを作って一度に送る（1枚ずつだと時間切れになるため）
          python3 - <<'PY'
          import json, os, shutil
          for x in json.load(open('manifest.json')):
              dst = os.path.join('../stage', x['key'])
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copyfile(x['path'], dst)
          PY
          cd ../stage
          gsutil -m -q -h "Content-Type:image/png" cp -n -r fig gs://qualification-learning-qlp-figures/
      - name: 置いた画像を確かめる
        run: |
          mkdir back
          gsutil -m -q cp -r gs://qualification-learning-qlp-figures/fig/own/_shared back/
          cd crops
          python3 - <<'PY'
          import hashlib, json, sys
          bad = 0
          m = json.load(open('manifest.json'))
          for x in m:
              p = '../back/' + x['key'][len('fig/own/'):]
              try:
                  got = hashlib.sha256(open(p, 'rb').read()).hexdigest()
              except FileNotFoundError:
                  got = None
              if got != x['sha256']:
                  print('MISMATCH', x['key']); bad += 1
          if bad: sys.exit(1)
          print('ALL_UPLOADED_AND_VERIFIED', len(m))
          PY
