name: Generate official runtime packets
on:
  workflow_dispatch:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/tools/verify-pinned-land-surveyor-pdfs.mjs'
      - '新システム開発/src/official-pdf-pins.js'
      - '.github/workflows/generate-official-runtime-packets.yml'
permissions:
  contents: write
jobs:
  land-surveyor-source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-learning-system
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Try direct Land Surveyor source verification
        id: moj
        continue-on-error: true
        working-directory: 新システム開発
        run: node tools/verify-pinned-land-surveyor-pdfs.mjs
      - name: Record blocked-authority outcome
        if: steps.moj.outcome != 'success'
        run: echo "MOJ_DIRECT_ACCESS_UNAVAILABLE; do not fail the qualification globally. A SHA-256-identical verified copy is required before extraction can continue."
      - name: State packet-generation boundary
        run: echo "q038 PDF source verification only; no learner packet is promoted until question extraction, visual verification, field classification and answer-cell verification all pass."
  takken-2025:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-learning-system
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and SHA-verify official PDF
        working-directory: 新システム開発
        run: node tools/verify-pinned-takken-pdf.mjs
      - name: Install deterministic PDF parser
        run: python -m pip install --quiet PyMuPDF==1.26.5
      - name: Build verified official packet
        working-directory: 新システム開発
        run: python tools/build-takken-verified-runtime-packet.py "$RUNNER_TEMP/takken-2025-verified.pdf" "data/runtime-packets/verified/takken-2025-u8.json"
      - name: Build manifest
        working-directory: 新システム開発
        run: node tools/build-runtime-packet-manifest.mjs
      - name: Promote generated manifest
        working-directory: 新システム開発
        run: cp data/runtime-packets/manifest.generated.json data/runtime-packets/manifest.json
      - name: Build qualification capability manifest
        working-directory: 新システム開発
        run: node tools/build-runtime-capabilities.mjs
      - name: Verify generated files
        run: |
          test -s "新システム開発/data/runtime-packets/verified/takken-2025-u8.json"
          test -s "新システム開発/data/runtime-packets/manifest.json"
          git diff --check
      - name: Commit verified runtime outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "新システム開発/data/runtime-packets/verified/takken-2025-u8.json" "新システム開発/data/runtime-packets/manifest.json" "新システム開発/data/runtime-packets/capabilities.json"
          git diff --cached --quiet && exit 0
          git commit -m "Generate verified official runtime packets"
          git push origin HEAD:ai-learning-system
