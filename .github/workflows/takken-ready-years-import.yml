name: 宅建解析完了済みの年度を共有ライブラリに登録
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/takken-ready-years-import-request.txt'
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    strategy:
      fail-fast: false
      matrix:
        file-index: [2, 9, 10]
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
      QLP_IMPORT_ENV: official-shared-only
      QLP_IMPORT_APPROVED: YES
    steps:
      - uses: actions/checkout@v4
      - name: 対象年度の明示承認を検査
        run: |
          grep -qx 'APPROVE_TAKKEN_READY_2018_2023_2024_IMPORT' 新システム開発/deploy/takken-ready-years-import-request.txt
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: スキャンされた過去問の日本語OCRを準備
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr-jpn
      - run: python -m pip install -r 新システム開発/parser/requirements.txt
      - run: npm ci --prefix 新システム開発/engine
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: 公式50問・正答・図表を検証し共通登録
        run: node 新システム開発/engine/scripts/seed-official-takken-batch.mjs ${{ matrix.file-index }} --commit
