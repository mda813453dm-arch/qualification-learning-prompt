name: ITパスポート公式原本のSHAとR8解析を診断
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '.github/workflows/itpass-stage-diagnostic.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm ci --prefix 新システム開発/engine
      - name: 15試験区分30原本の保存確認と令和8年度解析
        working-directory: 新システム開発/engine
        run: |
          parser_url="$(gcloud run services describe qlp-parser --project qualification-learning --region asia-northeast1 --format='value(status.url)')"
          parser_token="$(gcloud secrets versions access latest --secret qlp-parser-token --project qualification-learning)"
          PARSER_URL="$parser_url" PARSER_TOKEN="$parser_token" node --input-type=module <<'JS'
          import {Storage} from '@google-cloud/storage';
          import {sha256Hex} from './src/store.js';
          import {httpParser} from './src/parser-client.js';
          import {validateResult} from './src/ingest.js';
          import fs from 'node:fs/promises';
          const data=JSON.parse(await fs.readFile('./intake/itpass-official-pdf-pins-2026-10-22.json','utf8'));
          const bucket=new Storage().bucket('qualification-learning-qlp-figures');
          const get=async sha=>{
            const [bytes]=await bucket.file('staging/itpass-20261022/'+sha+'.pdf').download();
            if(!bytes)throw Error('STAGED_PDF_MISSING');
            const b=new Uint8Array(bytes);
            if(await sha256Hex(b)!==sha)throw Error('STAGED_PDF_HASH_MISMATCH');
            return b;
          };
          let count=0;
          for(const s of data.sources){
            await get(s.questionSha256);await get(s.answerSha256);
            count++;
            console.log('SOURCE_OK '+s.year+'_'+s.section);
          }
          console.log('ALL_SOURCE_PDFS_VERIFIED='+count*2);
          const s=data.sources.find(s=>s.year===2026);
          const q=await get(s.questionSha256),a=await get(s.answerSha256);
          const parse=httpParser({endpoint:process.env.PARSER_URL,token:process.env.PARSER_TOKEN,timeoutMs:1500000});
          const output=await parse({adapter:'itpass',year:s.year,section:s.section,
             question:{url:'https://www3.jitec.ipa.go.jp/JitesCbt/html/openinfo/pdf/questions/2026r08_ip_qs.pdf',sha256:s.questionSha256,bytes:q},
             answer:{url:'https://www3.jitec.ipa.go.jp/JitesCbt/html/openinfo/pdf/questions/2026r08_ip_ans.pdf',sha256:s.answerSha256,bytes:a}});
          const result=await validateResult({qualificationId:'q006',year:s.year,section:s.section},
             {question:s.questionSha256,answer:s.answerSha256},'0.8.2',output.result,output.assets);
          console.log('R8_PARSED '+JSON.stringify({status:result.status,packetCount:result.packetCount,
            excluded:result.excluded?.map(e=>({number:e.questionNumber,reason:e.reason})),
            assetCount:Object.keys(output.assets).length,answers:result.packets?.length}));
          if(result.status!=='ready'||result.packetCount!==100||result.excluded.length)process.exitCode=1;
          JS
