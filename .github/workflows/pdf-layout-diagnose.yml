name: 公式PDFのページの作り（図・表の位置）を調べる（読み取りのみ）
# 合図：新システム開発/deploy/pdf-layout-request.txt に「PDFのURL ページ番号…」を書いて push する。
# 結果は diag-pdf-layout ブランチに置く（ページ画像と、図・表・文字の位置）。
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/pdf-layout-request.txt'
permissions:
  contents: write
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r 新システム開発/parser/requirements.txt && sudo apt-get install -y potrace
      - name: ページの作りを書き出す
        run: |
          mkdir -p out
          python - <<'PY'
          import json, urllib.request, fitz
          words = open('新システム開発/deploy/pdf-layout-request.txt').read().split()
          url, pages = words[0], [int(x) for x in words[1:] if x.isdigit()]
          doc = fitz.open(stream=urllib.request.urlopen(url).read(), filetype='pdf')
          for n in pages:
              p = doc[n-1]
              p.get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False).save(f'out/p{n}.png')
              info = {'rect': list(p.rect), 'rotation': p.rotation}
              info['blocks'] = [{'bbox': [round(v,1) for v in b[:4]], 'text': b[4][:80]} for b in p.get_text('blocks')]
              info['drawings'] = [{'rect': [round(v,1) for v in d['rect']], 'n': len(d['items'])} for d in p.get_drawings()]
              info['images'] = [[round(v,1) for v in r] for x in p.get_images() for r in p.get_image_rects(x[0])]
              try:
                  info['tables'] = [{'bbox': [round(v,1) for v in t.bbox], 'rows': t.extract()} for t in p.find_tables().tables]
              except Exception as e:
                  info['tables'] = str(e)
              json.dump(info, open(f'out/p{n}.json', 'w'), ensure_ascii=False, indent=1)
              print(n, 'blocks', len(info['blocks']), 'drawings', len(info['drawings']), 'images', len(info['images']), 'tables', info['tables'] if isinstance(info['tables'], str) else len(info['tables']))
          PY
      - name: エンジンと同じ処理で、表と図の切り出しと表示を試す
        run: |
          cd 新システム開発/parser && python - <<'PY'
          import base64, json, urllib.request, fitz
          from qlp_parser.server import render_pages
          words = open('../deploy/pdf-layout-request.txt').read().split()
          data = urllib.request.urlopen(words[0]).read()
          for k, find in enumerate(w for w in words[1:] if not w.isdigit()):
              r = render_pages({'pdf': {'base64': base64.b64encode(data).decode()}, 'find': find, 'span': 2})
              ex = fitz.open(stream=base64.b64decode(r['excerpt']), filetype='pdf')
              for i, pg in enumerate(ex):
                  pg.get_pixmap(dpi=150).save(f'../../out/q{k+1}-crop{i+1}.png')
              open(f'../../out/q{k+1}-display.md', 'w').write(r['display'] or '')
              import re
              for j, svg in enumerate(re.findall(r'<svg.*?</svg>', r['display'] or '', re.S)):
                  vb = [float(x) for x in re.search(r'viewBox="([^"]+)"', svg).group(1).split()]
                  fixed = svg.replace('width="100%"', f'width="{vb[2]*2}" height="{vb[3]*2}"', 1)
                  fitz.open(stream=fixed.encode(), filetype='svg')[0].get_pixmap(dpi=72).save(f'../../out/q{k+1}-svg{j+1}.png')
                  print(find, 'svg', j + 1, 'chars', len(svg))
              json.dump({'find': find, 'matchedPage': r['matchedPage'], 'tables': r['tables'], 'figures': r['figures'], 'displayChars': len(r['display'] or '')}, open(f'../../out/q{k+1}.json', 'w'), ensure_ascii=False, indent=1)
              print(find, r['matchedPage'], 'display chars', len(r['display'] or ''))
          PY
      - name: 結果を diag-pdf-layout に置く
        run: |
          cd out
          git init -q -b diag-pdf-layout
          git config user.name diag; git config user.email diag@example.invalid
          git add -A; git commit -qm "layout diagnose"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-pdf-layout
