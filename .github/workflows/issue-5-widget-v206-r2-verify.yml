name: Issue 5 Widget v206 r2 year guard follow-up
on:
  push:
    branches: ['ci/issue-5-v206-r2-year-guard']
    paths: ['.github/workflows/issue-5-widget-v206-r2-verify.yml']
permissions:
  contents: read
  statuses: write
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify immutable r2 candidate
        run: |
          test "$(git rev-parse HEAD^)" = '07aa6145cc9904eff70c4cd82d4552c31c6c6e07'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/issue-5-widget-v206-r2-verify.yml'
          test "$(git rev-parse 'HEAD:新システム開発/engine/src/mcp.js')" = 'ec93c2050124d877d79626626be976a8b6da16e8'
          test "$(git rev-parse 'HEAD:新システム開発/engine/src/widget-current.js')" = 'c319ef2040deaca766da40934c40a51e59ba5b33'
          test "$(git rev-parse 'HEAD:新システム開発/engine/src/widget-v206.js')" = 'e10ac9f7085a0a92d896874b3538d0921824aad5'
          test "$(git rev-parse 'HEAD:新システム開発/engine/test/widget-browser.mjs')" = 'cce698f92ab7aabe9a718fb6dc26008384d09e48'
  mandatory-gate:
    needs: verify-source
    uses: ./.github/workflows/widget-browser-test.yml
  engine:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine regression
        working-directory: 新システム開発/engine
        run: npm test
