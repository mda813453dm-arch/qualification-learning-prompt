name: Issue 5 Widget v206 r2 verification
on:
  push:
    branches: ['ci/issue-5-v206-r2-107cedb']
    paths: ['.github/workflows/issue-5-widget-v206-r2-verify.yml']
permissions:
  contents: read
  statuses: write
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify immutable r2 candidate
        run: |
          test "$(git rev-parse HEAD~2)" = '18ea8637c2cfcf6acb4c0d835a36a16e24b1f53c'
          test "$(git diff --name-only HEAD~2 HEAD)" = '.github/workflows/issue-5-widget-v206-r2-verify.yml'
          test "$(git rev-parse 'HEAD:新システム開発/engine/src/mcp.js')" = 'ec93c2050124d877d79626626be976a8b6da16e8'
          test "$(git rev-parse 'HEAD:新システム開発/engine/src/widget-current.js')" = 'c319ef2040deaca766da40934c40a51e59ba5b33'
          test "$(git rev-parse 'HEAD:新システム開発/engine/src/widget-v206.js')" = '543f5cdca150ae3faed3b257a3c50ca5c0572ba7'
          test "$(git rev-parse 'HEAD:新システム開発/engine/test/widget-browser.mjs')" = '937110cc0f8ba2bec279b2f52a2f120a591040b7'
  mandatory-gate:
    needs: verify-source
    uses: ./.github/workflows/widget-browser-test.yml
  engine:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine regression
        working-directory: 新システム開発/engine
        run: npm test
