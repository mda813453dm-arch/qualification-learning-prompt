name: IPA学習問題登録状況の読み取り検査
on:
  push:
    branches: [ai-learning-system]
    paths: ['新システム開発/deploy/ipa-learning-audit-request.txt']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: grep -qx 'READ_ONLY_IPA_SHARED_LIBRARY_AUDIT' 新システム開発/deploy/ipa-learning-audit-request.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix 新システム開発/engine
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: node 新システム開発/engine/scripts/audit-ipa-learning.mjs
