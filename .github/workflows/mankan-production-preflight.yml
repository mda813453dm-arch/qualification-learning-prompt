name: Mankan AI explanation production-base preflight

on:
  push:
    branches: [ci/mankan-ai-explanation-prod-96f7cd0f]
    paths: [.github/workflows/mankan-production-preflight.yml]

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Verify immutable production and candidate bases, source diff and reviewed test fixture
        shell: bash
        run: |
          set -eu
          base=96f7cd0fa6abab2fb8e659a4939ed41c7b51a803
          candidate=4e3fb751c1a88ad2fd50aecd9b3e940e0903cc81
          test "$(git rev-parse HEAD^)" = e976bc70350eee72480ef0a4a49e022c4a609521
          test "$(git rev-parse HEAD^^)" = "$candidate"
          test "$(git rev-parse HEAD^^^)" = "$base"
          diff -u <(printf '%s\n' \
            '新システム開発/engine/src/app.js' \
            '新システム開発/engine/src/explain.js' \
            '新システム開発/engine/src/mcp.js') \
            <(git -c core.quotePath=false diff --name-only "$base" "$candidate")
          diff -u <(printf '%s\n' \
            '.github/workflows/mankan-production-preflight.yml' \
            'ci/mankan-ai-explanation.test.mjs' \
            '新システム開発/engine/test/widget-browser.mjs') \
            <(git -c core.quotePath=false diff --name-only "$candidate" HEAD)
          test "$(git hash-object 新システム開発/engine/test/widget-browser.mjs)" = b4dd616bf7e5eaac92c893d5e632770af5070b42
          cd 新システム開発/engine/src
          test "$(git hash-object app.js)" = 98328729bbb7689496c26663fe2d1190dbcfd364
          test "$(git hash-object explain.js)" = 403aec69ff3a5d42ebe35f47b8174005f250bb4d
          test "$(git hash-object mcp.js)" = 63c68a5f8c4c8345784a6e66ea3332de9cc54af8
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regress official scoring nuances and both E-reference routes
        run: node --test ci/mankan-ai-explanation.test.mjs
  widget-parser-preflight:
    needs: verify-candidate
    uses: mda813453dm-arch/qualification-learning-prompt/.github/workflows/widget-browser-test.yml@48986a4620373e90aef47c4151925b062a6e3dfa
    permissions:
      contents: read
      statuses: write
