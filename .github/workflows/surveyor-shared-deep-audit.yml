name: 測量士補140問の共有保存品質監査
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '.github/workflows/surveyor-shared-deep-audit.yml'
      - '新システム開発/deploy/surveyor-shared-deep-audit-request.txt'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: npm ci --prefix 新システム開発/engine
      - name: 保存済みの全問・正答・図の実体を確認（問題本文は出力しない）
        working-directory: 新システム開発/engine
        run: |
          node --input-type=module <<'JS'
          import { GcpStore } from './src/gcp-store.js';
          import { readResult, readFigure } from './src/cache.js';
          import { officialLibrary } from './src/official-library.js';
          import { CATALOG } from './src/catalog.js';
          import { sha256Hex } from './src/store.js';
          const store = new GcpStore({bucket:'qualification-learning-qlp-figures'});
          const cat = CATALOG.surveyor;
          const version = '0.8.2';
          const lib = await officialLibrary(store,cat,version,Date.now());
          if (lib.totalQuestions !== 140 || lib.stored.length !== 5) throw Error('SHARED_LIBRARY_INCOMPLETE');
          const pins = cat.officialShared.officialPdfPins;
          let all = 0, assets = 0;
          for (const year of [2022,2023,2024,2025,2026]) {
            const pin = pins[year];
            const qsha = pin.main;
            const asha = pin.answers?.main ?? pin.answer;
            const key = {qualificationId:'q063',year,section:'main',questionSha256:qsha,answerSha256:asha,parserVersion:version,owner:'_shared'};
            const found = await readResult(store,key,Date.now());
            const r = found.result;
            if (!found.hit || r?.status !== 'ready' || r?.excluded?.length || r?.packets?.length !== 28) throw Error('BAD_YEAR_'+year);
            const numbers = new Set(), files = new Map();
            for (const p of r.packets) {
              if (p.questionId !== 'q063:'+year+':main:'+p.questionNumber || p.questionNumber < 1 || p.questionNumber > 28) throw Error('QUESTION_ID_'+year);
              if (numbers.has(p.questionNumber)) throw Error('DUPLICATE_'+year);
              numbers.add(p.questionNumber);
              if (!Array.isArray(p.choices) || p.choices.length !== 5 || p.choices.some(v=>typeof v!=='string' || !v.trim())) throw Error('CHOICES_'+year+'_'+p.questionNumber);
              if (!Number.isInteger(p.correctAnswer) || p.correctAnswer < 1 || p.correctAnswer > 5) throw Error('ANSWER_'+year+'_'+p.questionNumber);
              if (p.questionPdfSha256 !== qsha || p.answerPdfSha256 !== asha) throw Error('SOURCE_'+year);
              for (const fig of p.figures ?? []) {
                files.set(fig.file,fig.sha256);
                if (fig.svgFile) files.set(fig.svgFile,fig.svgSha256);
              }
              if (!(p.figures?.length) && (p.diagramRequired !== false || !['text','ocr'].includes(p.stemMode) || !['text','ocr'].includes(p.choiceMode) || p.verification?.visual !== 'question_level_pdf_graphics_checked')) throw Error('FIGURE_REQUIRED_'+year+'_'+p.questionNumber);
            }
            for (let i=1;i<=28;i++) if (!numbers.has(i)) throw Error('MISSING_'+year+'_'+i);
            for (const [file,hash] of files) {
              const bytes = await readFigure(store,qsha,version,file,'_shared');
              if (!bytes || await sha256Hex(new Uint8Array(bytes)) !== hash) throw Error('FIGURE_FILE_'+year);
            }
            all += numbers.size; assets += files.size;
            console.log('VERIFIED_YEAR_'+year+':'+numbers.size+':FIGURE_ASSETS='+files.size);
          }
          if (all !== 140) throw Error('TOTAL_MISMATCH');
          console.log('VERIFIED_ALL:QUESTIONS='+all+':FIGURE_ASSETS='+assets);
          JS
