name: 賃管11年度500問の4項目メタデータ登録
on:
  push:
    branches: [ai-learning-system]
    paths: ['新システム開発/deploy/chintai-metadata-import-request.txt']
permissions:
  contents: read
concurrency:
  group: qlp-chintai-metadata-only
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
      QLP_METADATA_ENV: chintai-metadata-only
      QLP_METADATA_APPROVED: YES
      QLP_OCR: vision
    steps:
      - uses: actions/checkout@v4
      - name: Validate user's metadata-only registration instruction
        run: grep -qx 'APPROVE_CHINTAI_2015_2025_METADATA_ONLY_NO_QUESTION_TEXT' 新システム開発/deploy/chintai-metadata-import-request.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Metadata extraction dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr-jpn
          python -m pip install -r 新システム開発/parser/requirements.txt
          npm ci --prefix 新システム開発/engine
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Discard PDF and problem text; persist four fields only and verify readback
        run: |
          export QLP_VISION_TOKEN="$$(gcloud auth print-access-token)"
          node 新システム開発/engine/scripts/seed-chintai-metadata.mjs ${{ matrix.year }} --commit
