name: FP2・FP3公式PDF原本の安全な共有保存
on:
  push:
    branches: [ai-learning-system]
    paths: ['新システム開発/deploy/fp-official-archive-request.txt']
permissions:
  contents: read
concurrency:
  group: qlp-fp-official-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
      QLP_FP_ARCHIVE_APPROVED: YES
    steps:
      - uses: actions/checkout@v4
      - run: grep -qx 'APPROVE_JAFP_FP2_FP3_OFFICIAL_ARCHIVE_V1' 新システム開発/deploy/fp-official-archive-request.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix 新システム開発/engine
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: node 新システム開発/engine/scripts/archive-fp-official.mjs --commit
