name: マンション管理士350問の本番共有保存・独立読取検査
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/mankan-readiness-request.txt'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm ci --prefix 新システム開発/engine
      - name: 本番共有キャッシュを新しいジョブから独立検査
        shell: bash
        run: |
          gcloud storage buckets describe gs://qualification-learning-qlp-figures >/dev/null
          cd 新システム開発/engine
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {GcpStore} from './src/gcp-store.js';
          import {officialLibrary} from './src/official-library.js';
          import {CATALOG} from './src/catalog.js';
          const store = new GcpStore({bucket:'qualification-learning-qlp-figures'});
          const state = await officialLibrary(store,CATALOG.mankan,'0.8.2',Date.now());
          assert.equal(state.stored.length,7,'SHARED_YEARS_NOT_PERSISTED');
          assert.equal(state.totalQuestions,350,'SHARED_QUESTIONS_NOT_PERSISTED');
          assert.deepEqual(state.missing,[],'MISSING_YEARS');
          console.log('MANKAN_READ_ACCESS_OK sharedYears='+state.stored.length+' totalQuestions='+state.totalQuestions+' missing='+state.missing.length);
          JS
