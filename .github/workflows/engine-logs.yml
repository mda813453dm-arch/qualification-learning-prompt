name: 公開中の学習エンジンの記録を読む（読み取りのみ）
# 合図：新システム開発/deploy/logs-request.txt を更新して push する。
# 出すもの：直近の呼び出しの「日時・種類・結果の番号・かかった時間・パス」と、エラーの記録だけ。合言葉・本文は出さない。
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/logs-request.txt'
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 呼び出しの記録（直近1時間）
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="qlp-engine" AND httpRequest.requestUrl:"/v1/"' \
            --project qualification-learning --freshness=2h --limit=150 \
            --format='value(timestamp,httpRequest.requestMethod,httpRequest.status,httpRequest.latency,httpRequest.requestUrl)' || true
      - name: 引継ぎの読み込みの記録（直近16時間）
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="qlp-engine" AND (httpRequest.requestUrl:"/v1/handoff/import" OR jsonPayload.event="handoff_import_failed")' \
            --project qualification-learning --freshness=16h --limit=60 \
            --format='value(timestamp,httpRequest.status,httpRequest.requestUrl,jsonPayload.event,jsonPayload.candidates,jsonPayload.length)' || true
      - name: エラーの記録（直近1時間）
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="qlp-engine" AND severity>=WARNING' \
            --project qualification-learning --freshness=2h --limit=40 \
            --format='value(timestamp,severity,httpRequest.status,httpRequest.requestMethod,httpRequest.requestUrl,textPayload,jsonPayload.message)' || true
      - name: アプリ・コネクタの呼び出し（方法とツール名だけ。直近3時間）
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="qlp-engine" AND jsonPayload.event="mcp_rpc"' \
            --project qualification-learning --freshness=3h --limit=80 \
            --format='value(timestamp,jsonPayload.route,jsonPayload.method,jsonPayload.tool,jsonPayload.kind)' || true
      - name: 画面の通信・描画の到達点（学習内容・識別子なし）
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="qlp-engine" AND jsonPayload.event="widget_ui"' \
            --project qualification-learning --freshness=3h --limit=80 \
            --format='value(timestamp,jsonPayload.version,jsonPayload.stage)' || true
