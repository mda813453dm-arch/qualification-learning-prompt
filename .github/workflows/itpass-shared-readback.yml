name: ITパスポート公式15区分1500問の共有保存独立監査
on:
  push:
    branches: [ai-learning-system]
    paths: ['新システム開発/deploy/itpass-shared-audit-request.txt']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix 新システム開発/engine
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Read all 15 sections and 1500 packets from production
        run: node 新システム開発/engine/scripts/audit-itpass-shared-library.mjs
