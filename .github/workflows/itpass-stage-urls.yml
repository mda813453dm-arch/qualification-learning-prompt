        run: |
          node --input-type=module <<'JS'
          import {Storage} from '@google-cloud/storage';
          const storage=new Storage();
          const bucket=storage.bucket('qualification-learning-qlp-figures');
          for (const f of JSON.parse(process.env.ITPASS_FILES)) {
            const key='staging/itpass-20261022/'+f.sha+'.pdf';
            const [url]=await bucket.file(key).getSignedUrl({
              version:'v4',action:'write',expires:Date.now()+25*60*1000,
              contentType:'application/pdf',
            });
            console.log('SIGNED_ITPASS '+JSON.stringify({filename:f.filename,sha:f.sha,key,url}));
          }
          JS
