name: ITパスポート公式PDFの一時転送URL発行
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '.github/workflows/itpass-stage-urls.yml'
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: npm ci --prefix 新システム開発/engine
      - name: 公式添付30原本専用の短期署名URLを発行
        working-directory: 新システム開発/engine
