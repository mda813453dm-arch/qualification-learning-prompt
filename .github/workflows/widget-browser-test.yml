name: 学習画面の通信・ボタン試験
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/engine/src/**'
      - '新システム開発/parser/qlp_parser/**'
      - '新システム開発/parser/test_land_surveyor*.py'
      - '新システム開発/parser/test_parser_status.py'
      - '新システム開発/deploy/cloudshell-deploy.sh'
      - '新システム開発/engine/test/**'
      - '新システム開発/engine/package.json'
      - '新システム開発/engine/package-lock.json'
      - '.github/workflows/widget-browser-test.yml'
permissions:
  contents: read
  statuses: write
jobs:
  widget:
    runs-on: ubuntu-latest
    # Official Playwright image carries matching Chromium/WebKit shared libraries.
    # Runner libraries alone are insufficient, and apt mirrors can exceed CI timeout.
    container:
      image: mcr.microsoft.com/playwright:v1.51.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 配置スクリプトの構文検査
        run: bash -n 新システム開発/deploy/cloudshell-deploy.sh
      - name: エンジン・通信の回帰試験
        working-directory: 新システム開発/engine
        run: npm test
      - name: 試験専用ブラウザを準備（本番依存には追加しない）
        run: |
          npm install --prefix "$RUNNER_TEMP/qlp-browser" playwright@1.51.1
          # The container already includes the exact browser engines and system libraries.
          # Verify installation without installing ubuntu apt packages.
          PLAYWRIGHT_BROWSERS_PATH=/ms-playwright node "$RUNNER_TEMP/qlp-browser/node_modules/playwright/cli.js" install chromium webkit
      - name: 375pxで免除・学習状況・回答・採点・引継ぎを操作
        run: |
          PLAYWRIGHT_BROWSERS_PATH=/ms-playwright PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/qlp-browser/node_modules/playwright" node 新システム開発/engine/test/widget-browser.mjs
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/qlp-browser/node_modules/playwright" node 新システム開発/engine/test/widget-explanation-browser.mjs
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/qlp-browser/node_modules/playwright" node 新システム開発/engine/test/widget-confirmation-browser.mjs
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/qlp-browser/node_modules/playwright" node 新システム開発/engine/test/widget-instant-gyosei-browser.mjs
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/qlp-browser/node_modules/playwright" node 新システム開発/engine/test/widget-upload-browser.mjs
          PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/qlp-browser/node_modules/playwright" node 新システム開発/engine/test/widget-anytime-upload-browser.mjs
      - name: 画面テストの合否をコミット状態に記録
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QLP_JOB_STATUS: ${{ job.status }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$QLP_JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          payload=$(printf '{"state":"%s","context":"qlp-widget-mobile","description":"375px Chromium/WebKit widget regression","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$GH_REPO" "$GH_RUN_ID")
          curl --fail-with-body --retry 2 --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" -d "$payload" \
            "https://api.github.com/repos/$GH_REPO/statuses/$GH_SHA"
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 土地家屋調査士 午前・午後のPDFパーサー単体テスト（合成ページ）
        run: |
          python -m pip install -r 新システム開発/parser/requirements.txt
          PYTHONPATH=新システム開発/parser python -m unittest discover -s 新システム開発/parser -p 'test_*.py' -v
