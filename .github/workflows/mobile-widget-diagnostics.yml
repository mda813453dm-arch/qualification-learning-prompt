name: Android iOS 学習枠の表示診断（読取専用）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/mobile-diagnostic-request.txt'
permissions:
  contents: read
  statuses: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: UIリソースの読取発生状況（個人情報なし・集計のみ）
        run: |
          set -euo pipefail
          QUERY='resource.type="cloud_run_revision" AND resource.labels.service_name="qlp-engine" AND timestamp>="2026-11-01T21:00:00Z" AND (textPayload:"widget_resource_read" OR textPayload:"widget_session_start_responded" OR textPayload:"widget_ui" OR textPayload:"widget_session_start_called")'
          gcloud logging read "$QUERY" --project qualification-learning --limit 2500 --format=json > /tmp/mobile-events.json
          python3 - <<'PY'
          import json
          from collections import Counter
          logs=json.load(open('/tmp/mobile-events.json'))
          kinds=Counter()
          buckets={}
          for x in logs:
              text=x.get('textPayload','')
              try:
                  d=json.loads(text)
                  kind=d.get('event')
                  if not kind:continue
                  v=str(d.get('version','unknown'))
                  kinds[(kind,v)]+=1
                  ts=x.get('timestamp','')
                  hour=ts[:13]
                  buckets[(hour,kind)]=buckets.get((hour,kind),0)+1
              except (ValueError,TypeError):pass
          print('EVENTS BY TYPE/VERSION')
          for k,n in sorted(kinds.items()):print(k[0],k[1],n)
          print('EVENTS BY UTC HOUR')
          for k,n in sorted(buckets.items()):print(k[0],k[1],n)
          print('TOTAL',sum(kinds.values()))
          PY
      - name: GitHubコミットに集計結果の成否を報告
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then STATE=success; else STATE=failure; fi
          payload=$(printf '{"state":"%s","context":"qlp-mobile-diagnostic","description":"Read-only widget telemetry counts","target_url":"https://github.com/%s/actions/runs/%s"}' "$STATE" "$GH_REPO" "$GH_RUN_ID")
          curl --fail-with-body --retry 2 --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -d "$payload" "https://api.github.com/repos/$GH_REPO/statuses/$GH_SHA"
