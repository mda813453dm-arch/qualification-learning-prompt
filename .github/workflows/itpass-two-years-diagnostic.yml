name: ITパスポート令和6・7年度の無書込解析診断
on:
  push:
    branches: [ai-learning-system]
    paths: ['.github/workflows/itpass-two-years-diagnostic.yml']
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        year: [2024,2025]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Japanese OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr-jpn
          python -m pip install -r 新システム開発/parser/requirements.txt
      - name: 複数年度の100問解析（無書込）
        env:
          PYTHONPATH: 新システム開発/parser
          ITPASS_YEAR: ${{ matrix.year }}
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open('新システム開発/engine/intake/itpass-official-pdf-pins-2026-10-22.json'))
          s=next(s for s in d['sources'] if s['year']==int(os.environ['ITPASS_YEAR']))
          with open('/tmp/ip-pins.txt','w') as f:
              f.write(s['questionSha256']+'\n'+s['answerSha256']+'\n')
          PY
          qsha="$(sed -n '1p' /tmp/ip-pins.txt)"
          asha="$(sed -n '2p' /tmp/ip-pins.txt)"
          gcloud storage cp "gs://qualification-learning-qlp-figures/att/$qsha.pdf" /tmp/ip-question.pdf
          gcloud storage cp "gs://qualification-learning-qlp-figures/att/$asha.pdf" /tmp/ip-answer.pdf
          python -m qlp_parser.cli --adapter itpass --year "${ITPASS_YEAR}" --section 公開問題 --question-pdf /tmp/ip-question.pdf --question-sha256 "$qsha" --answer-pdf /tmp/ip-answer.pdf --answer-sha256 "$asha" --assets-dir /tmp/ip-assets > /tmp/ip-result.json
          python -c 'import json,collections,os;d=json.load(open("/tmp/ip-result.json"));print("ITPASS_YEAR_DIAG",os.environ["ITPASS_YEAR"],d.get("status"),d.get("packetCount"),dict(collections.Counter(e.get("reason") for e in d.get("excluded",[]))),"assets",sum(len(p.get("figures",[])) for p in d.get("packets",[])))'
