name: Google Cloud に配置する（資格学習システム）
# iPhone だけで運用するため、Cloud Shell の代わりに GitHub Actions から配置する。
# 必要なもの：リポジトリの Secret「GCP_SA_KEY」（配置用サービスアカウントの鍵 JSON）。
# 配置の合図：deploy/deploy-request.txt を更新して push する（workflow_dispatch は main にファイルが無いと使えないため）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/deploy-request.txt'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: deploy-google-cloud
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: qualification-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 配置前の回帰テスト
        working-directory: 新システム開発/engine
        run: npm test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: プロジェクトを選ぶ
        run: |
          gcloud config set project "$PROJECT"
          # 外から呼ぶときに必要な機能（Cloud Shell では最初から使える）
          gcloud services enable cloudresourcemanager.googleapis.com iam.googleapis.com serviceusage.googleapis.com
      - name: 配置する（cloudshell-deploy.sh と同じ手順）
        run: bash 新システム開発/deploy/cloudshell-deploy.sh
      - name: 解説の公開版・ツール仕様・読取経路を確認（学習記録は変更しない）
        run: |
          export QLP_BASE_URL="$(gcloud run services describe qlp-engine --project qualification-learning --region asia-northeast1 --format='value(status.url)')"
          export QLP_TEST_TOKEN="$(gcloud secrets versions access latest --secret qlp-api-token --project qualification-learning)"
          node 新システム開発/deploy/check-explanation.mjs
      - name: 測量士補の2026年度問6を年度・問番号で直接指定し、公開後に検証
        run: |
          export QLP_BASE_URL="$(gcloud run services describe qlp-engine --project qualification-learning --region asia-northeast1 --format='value(status.url)')"
          export QLP_TEST_TOKEN="$(gcloud secrets versions access latest --secret qlp-api-token --project qualification-learning)"
          node 新システム開発/deploy/check-direct-question.mjs
      - name: 記述式の公式原本・解答表示・画面復元を実接続で検証（採点は行わない）
        run: |
          export QLP_BASE_URL="$(gcloud run services describe qlp-engine --project qualification-learning --region asia-northeast1 --format='value(status.url)')"
          export QLP_TEST_TOKEN="$(gcloud secrets versions access latest --secret qlp-api-token --project qualification-learning)"
          node 新システム開発/deploy/check-descriptive.mjs
      - name: 新しい取り込み画面の公開版を検証
        run: |
          export QLP_BASE_URL="$(gcloud run services describe qlp-engine --project qualification-learning --region asia-northeast1 --format='value(status.url)')"
          node -e 'fetch(process.env.QLP_BASE_URL + "/v1/release").then(r => {if(!r.ok)throw Error("Release status " + r.status);return r.json()}).then(d => {if(d.build !== "2026-10-30-v140-manual-ai-explanation" || d.uploadBatchFiles !== 10 || d.yearSelectionRequired !== false)throw Error("Unexpected release: " + JSON.stringify(d));console.log("v140 public release verified", d)}).catch(e => {console.error(e);process.exit(1)})'
      - name: 学習者が貼るプロンプトを表示する（トークンは入っていない）
        run: |
          echo "===== 学習者が貼るプロンプト ここから ====="
          cat "$HOME/qlp-start-prompt.txt"
          echo "===== ここまで ====="

      - name: 配置検証結果をコミット状態に記録
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QLP_JOB_STATUS: ${{ job.status }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$QLP_JOB_STATUS" = "success" ]; then
            state=success
          else
            state=failure
          fi
          payload=$(printf '{"state":"%s","context":"qlp-cloud-run-deploy","description":"Cloud Run deployment and production checks","target_url":"https://github.com/%s/actions/runs/%s"}' "$state" "$GH_REPO" "$GH_RUN_ID")
          curl --fail-with-body --retry 2 --silent --show-error -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             -d "$payload" "https://api.github.com/repos/$GH_REPO/statuses/$GH_SHA"
