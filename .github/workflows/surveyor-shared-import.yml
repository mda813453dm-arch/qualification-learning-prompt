name: 測量士補の公式過去問を共通保存（全問検査）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/surveyor-shared-import-request.txt'
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm ci --prefix 新システム開発/engine
      - name: 原本SHA・問題28問・公式正答・図表を全検査した年度だけ共通登録
        env:
          SURVEYOR_IMPORT_JOB: q063~2r7kqfjmiq
        run: |
          parser_url="$(gcloud run services describe qlp-parser --project qualification-learning --region asia-northeast1 --format='value(status.url)')"
          parser_token="$(gcloud secrets versions access latest --secret qlp-parser-token --project qualification-learning)"
          PARSER_URL="$parser_url" PARSER_TOKEN="$parser_token" node 新システム開発/engine/scripts/import-shared-surveyor.mjs
