name: マンション管理士公式過去問の共有保存（実取込）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/mankan-import-request.txt'
permissions:
  contents: read
concurrency:
  group: qlp-mankan-shared-import
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
      QLP_IMPORT_ENV: official-shared-only
    steps:
      - uses: actions/checkout@v4
      - name: 承認文字列を厳密に確認
        shell: bash
        run: |
          if ! grep -qx 'APPROVE_MANKAN_OFFICIAL_SHARED_IMPORT_2019_2025' 新システム開発/deploy/mankan-import-request.txt; then
            echo '承認文字列がないため書き込みません。'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 解析ツールをインストール
        run: |
          python -m pip install -r 新システム開発/parser/requirements.txt
          npm ci --prefix 新システム開発/engine
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 7年度14原本をSHA照合後に350問を共通保存
        env:
          QLP_IMPORT_APPROVED: YES
        run: node 新システム開発/engine/scripts/seed-official-mankan.mjs --commit
