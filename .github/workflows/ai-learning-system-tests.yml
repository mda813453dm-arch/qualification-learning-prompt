name: AI学習システム試作テスト
on:
  workflow_dispatch:
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PDF解析依存の導入
        run: npm install --no-audit --no-fund
        working-directory: 新システム開発
      - name: 学習システムの単体・結合テスト
        run: npm test
        working-directory: 新システム開発
