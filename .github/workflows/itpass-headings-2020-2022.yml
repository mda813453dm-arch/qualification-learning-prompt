name: ITパスポート令和2・4年度の見出しと欠落診断
on:
  push:
    branches: [ai-learning-system]
    paths: ['.github/workflows/itpass-headings-2020-2022.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        index: [8, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr-jpn
          python -m pip install -r 新システム開発/parser/requirements.txt
      - name: Examine OCR heading order and crop for source SHA
        env:
          QLP_OCR: vision
          PYTHONPATH: 新システム開発/parser
          INDEX: ${{ matrix.index }}
        run: |
          python - <<'PY'
          import json,os
          m=json.load(open('新システム開発/engine/intake/itpass-official-pdf-pins-2026-10-22.json'))
          s=m['sources'][int(os.environ['INDEX'])]
          open('/tmp/qsha','w').write(s['questionSha256'])
          print('HEADING_SOURCE',s['year'],s['section'],s['questionSha256'])
          PY
          qsha="$(cat /tmp/qsha)"
          gcloud storage cp "gs://qualification-learning-qlp-figures/att/$qsha.pdf" /tmp/ip-question.pdf
          export QLP_VISION_TOKEN="$(gcloud auth print-access-token)"
          python - <<'PY'
          import fitz,os
          from qlp_parser.adapters import itpass
          d=fitz.open('/tmp/ip-question.pdf')
          qs=itpass.parse_questions(d)
          print('IP_RAW_TOTAL',os.environ['INDEX'],len(qs))
          for i,q in enumerate(qs):
              if (os.environ['INDEX']=='8' and 65<=q.number<=80) or (os.environ['INDEX']=='10' and (25<=q.number<=38 or 90<=q.number<=103)) or 'question_number_out_of_order' in q.notes:
                  print('IP_HEADING',i,q.number,q.pages,q.rect,q.notes)
          PY
