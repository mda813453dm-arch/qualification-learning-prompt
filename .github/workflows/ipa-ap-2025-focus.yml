name: IPA応用情報2025午前を優先検証
on:
  push:
    branches: [ai-learning-system]
    paths: ['新システム開発/deploy/ipa-ap-focus-request.txt']
permissions:
  contents: read
concurrency:
  group: qlp-ipa-ap-2025-focus
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
      QLP_IPA_LEARNING_APPROVED: YES
      QLP_IPA_ONLY: ap:2025
      QLP_OCR: vision
    steps:
      - uses: actions/checkout@v4
      - run: grep -qx 'FOCUSED_AP_2025_OFFICIAL_MORNING_IMPORT_V2' 新システム開発/deploy/ipa-ap-focus-request.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm ci --prefix 新システム開発/engine
      - run: pip install -r 新システム開発/parser/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn potrace
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: node 新システム開発/engine/scripts/seed-ipa-learning.mjs --commit
