name: Google Vision の今月の使用量と宅建ページの控えを確かめる（読むだけ）
# 合図：新システム開発/deploy/vision-quota-check-request.txt を更新して push する。
# Vision は一度も呼ばない。Cloud Monitoring の呼び出し回数と、OCR の控え（Cloud Storage）の有無を読むだけ。
# 目的：無料枠（毎月1,000ユニット）の範囲で宅建の走査PDF 8区分を読めるかを、料金が発生する前に判断する。
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/vision-quota-check-request.txt'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: qualification-learning
      BUCKET: qualification-learning-qlp-figures
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Vision の呼び出し回数（10月・11月、日ごと）
        continue-on-error: true
        run: |
          gcloud config set project "$PROJECT"
          TOKEN="$(gcloud auth print-access-token)"
          for range in "2026-10-01T00:00:00Z 2026-11-01T00:00:00Z" "2026-11-01T00:00:00Z $(date -u +%Y-%m-%dT%H:%M:%SZ)"; do
            set -- $range
            echo "== $1 .. $2"
            curl -sS -G -H "Authorization: Bearer $TOKEN" \
              "https://monitoring.googleapis.com/v3/projects/$PROJECT/timeSeries" \
              --data-urlencode 'filter=metric.type="serviceruntime.googleapis.com/api/request_count" AND resource.type="consumed_api" AND resource.labels.service="vision.googleapis.com"' \
              --data-urlencode "interval.startTime=$1" --data-urlencode "interval.endTime=$2" \
              --data-urlencode 'aggregation.alignmentPeriod=86400s' --data-urlencode 'aggregation.perSeriesAligner=ALIGN_SUM' \
              --data-urlencode 'aggregation.crossSeriesReducer=REDUCE_SUM' --data-urlencode 'aggregation.groupByFields=metric.label.response_code_class' \
              > ts.json
            python3 - <<'PY'
          import json
          d = json.load(open('ts.json'))
          if 'error' in d: print('ERROR', d['error'].get('status'), d['error'].get('message')); raise SystemExit
          total = 0
          for s in d.get('timeSeries', []):
              cls = s.get('metric', {}).get('labels', {}).get('response_code_class')
              pts = [(p['interval']['endTime'][:10], int(p['value'].get('int64Value', 0))) for p in s['points']]
              sub = sum(v for _, v in pts); total += sub
              print('class', cls, 'sum', sub, sorted(pts))
          print('TOTAL_REQUESTS', total)
          PY
          done
      - name: Vision の割り当て・請求先（参考）
        continue-on-error: true
        run: |
          gcloud billing projects describe "$PROJECT" --format='value(billingEnabled,billingAccountName)' || true
          gcloud services list --enabled --filter='name:vision.googleapis.com' --format='value(name)' || true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 宅建8区分のページ数と、OCRの控えが既にあるか
        run: |
          pip install -q pymupdf==1.28.2
          cd 新システム開発/parser
          python - <<'PY'
          import json, os, subprocess, hashlib
          import pymupdf as fitz
          from qlp_parser import ocr
          m = json.load(open('../deploy/takken-upload-manifest-20261022.json'))
          total = have = 0
          idx = []
          for i in [0, 1, 3, 4, 5, 6, 7, 8]:
              f = m['files'][i]
              local = f'/tmp/{f["sha256"]}.pdf'
              subprocess.run(['gsutil', '-q', 'cp', f'gs://{os.environ["BUCKET"]}/att/{f["sha256"]}.pdf', local], check=True)
              assert hashlib.sha256(open(local, 'rb').read()).hexdigest() == f['sha256']
              d = fitz.open(local); n = h = 0
              for p in d:
                  key, png, *_ = ocr._render(p, "6")
                  k = hashlib.sha256(png).hexdigest()
                  os.makedirs('/tmp/tv/vision', exist_ok=True)
                  r = subprocess.run(['gsutil', '-q', 'cp', f'gs://{os.environ["BUCKET"]}/vision/{k}.json', f'/tmp/tv/vision/{k}.json'])
                  idx.append({'year': f['year'], 'section': f['section'], 'sha256': f['sha256'], 'page': p.number + 1, 'key': k, 'cached': r.returncode == 0})
                  n += 1; h += r.returncode == 0
              print(f['year'], f['section'], f['sha256'][:12], 'pages', n, 'cached', h)
              total += n; have += h
          print('TAKKEN_PAGES', total, 'CACHED', have, 'NEED_VISION', total - have)
          print('MISSING', [(x['year'], x['section'], x['page']) for x in idx if not x['cached']])
          json.dump(idx, open('/tmp/tv/index.json', 'w'), ensure_ascii=False, indent=1)
          PY
      - name: 控えを diag-takken-vision ブランチに置く（読むだけで得た既存の控え）
        run: |
          cd /tmp/tv
          git init -q -b diag-takken-vision
          git config user.name diag; git config user.email diag@example.invalid
          git add -A; git commit -qm "takken vision cache copies"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-takken-vision
