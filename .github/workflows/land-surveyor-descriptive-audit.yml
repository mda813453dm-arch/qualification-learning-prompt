name: 土地家屋調査士記述式の公式原本検証（保存なし）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '.github/workflows/land-surveyor-descriptive-audit.yml'
      - '新システム開発/parser/qlp_parser/descriptive.py'
      - '新システム開発/parser/test_descriptive.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: PDF parser dependencies
        run: pip install -r 新システム開発/parser/requirements.txt
      - name: Unit tests - Japanese headings and section separation
        env:
          PYTHONPATH: 新システム開発/parser
        run: python -m unittest discover -s 新システム開発/parser -p test_descriptive.py -v
      - name: Official Ministry of Justice originals - SHA and all 12 descriptive questions
        shell: bash
        env:
          PYTHONPATH: 新システム開発/parser
        run: |
          python - <<'PY'
          import hashlib, subprocess, tempfile
          from pathlib import Path
          from qlp_parser.adapters.land_surveyor import PIN_BY_YEAR
          from qlp_parser.descriptive import extract_descriptive
          names = {
            2022: ('001383834','001383847'),
            2023: ('001408935','001408936'),
            2024: ('001427201','001427202'),
            2025: ('001450010','001450011'),
          }
          with tempfile.TemporaryDirectory() as work:
            for year,(am,pm) in names.items():
              for section,file in (('午前の部',am),('午後の部',pm)):
                path = Path(work)/(file+'.pdf')
                subprocess.run(['curl','--fail','--location','--silent','--show-error','--retry','2',
                  '--max-time','50','--header','User-Agent: Mozilla/5.0',
                  '--output',str(path),'https://www.moj.go.jp/content/'+file+'.pdf'],check=True)
                data=path.read_bytes()
                digest=hashlib.sha256(data).hexdigest()
                assert digest==PIN_BY_YEAR[year][section], 'source SHA mismatch'
                for number in ((11,) if section=='午前の部' else (21,22)):
                  result=extract_descriptive(pdf_bytes=data,year=year,section=section,
                    number=number,expected_sha=digest)
                  assert result['status']=='ready' and result['gradingMode']=='none'
                  assert result['pageNumbers'] and len(result['pages'])==len(result['pageNumbers'])
                  assert result['textComplete'] and result['text']
                  assert isinstance(result.get('layout'),list) and result['layout'], 'layout missing'
                  assert all(b['kind'] in ('text','table','figure') for b in result['layout'])
                  assert all(b.get('file') in result['diagrams'] for b in result['layout'] if b['kind']=='figure')
                  kinds = {name:sum(b['kind']==name for b in result['layout']) for name in ('text','table','figure')}
                  if year==2025 and section=='午前の部' and number==11:
                    assert kinds['table']>=2, '2025 morning 11 needs both observation and survey tables'
                    assert kinds['figure']>=1, '2025 morning 11 needs official boundary diagram'
                    assert any('243' in str(b['rows']) for b in result['layout'] if b['kind']=='table'), 'official angles lost'
                    assert any('200.00' in str(b['rows']) for b in result['layout'] if b['kind']=='table'), 'survey coordinates lost'
                  print('LAYOUT',year,section,number,kinds,
                    'figPages',[b['page'] for b in result['layout'] if b['kind']=='figure'],flush=True)
                  layout=result.get('layout',[])
                  tables=[b for b in layout if b.get('kind')=='table']
                  diagrams=[b for b in layout if b.get('kind')=='figure']
                  assert layout and all(b.get('kind') in ('text','table','figure') for b in layout)
                  assert len(diagrams)==len(result.get('diagrams',{}))
                  assert all(b['file'] in result['diagrams'] for b in diagrams)
                  print('PASS',year,section,'問'+str(number),'pages',result['pageNumbers'],
                        'tables',len(tables),'figures',len(diagrams),'blocks',len(layout),
                        'textlen',len(result['text']),flush=True)
          PY
      - name: 2015〜2021年の保存版・記述式全21問もSHA照合し原本ページ表示を検証
        shell: bash
        env:
          PYTHONPATH: 新システム開発/parser
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from qlp_parser.adapters.land_surveyor import PIN_BY_YEAR
          from qlp_parser.descriptive import extract_descriptive

          manifest = json.loads(Path('新システム開発/engine/data/land-surveyor-archive-source-manifest.json').read_text(encoding='utf-8'))
          rows = {row['year']:row for row in manifest['years']}
          for year in range(2015,2022):
            for section,numbers in [('午前の部',[11]),('午後の部',[21,22])]:
              row=rows[year]['questionSources'][section]
              request=Request(row['url'],headers={'User-Agent':'Mozilla/5.0'})
              with urlopen(request,timeout=90) as response:
                assert response.geturl().startswith('https://izuki.net/wp-content/uploads/')
                data=response.read(31*1024*1024)
              assert data.startswith(b'%PDF-') and len(data)<30*1024*1024
              sha=hashlib.sha256(data).hexdigest()
              assert sha==row['sha256']==PIN_BY_YEAR[year][section]
              for number in numbers:
                result=extract_descriptive(pdf_bytes=data,year=year,section=section,
                                           number=number,expected_sha=sha)
                assert result['status']=='ready' and result['gradingMode']=='none'
                assert result['solutionAvailable'] is False
                assert result['pageNumbers'] and len(result['pages'])==len(result['pageNumbers'])
                assert result['textComplete'] and result['text'] and result['layout']
                assert all(b['kind'] in ('text','table','figure') for b in result['layout'])
                assert all(b['file'] in result['diagrams'] for b in result['layout'] if b['kind']=='figure')
                print('ARCHIVED_DESCRIPTIVE_VERIFIED',year,section,number,
                      'pages',result['pageNumbers'],flush=True)
          PY
