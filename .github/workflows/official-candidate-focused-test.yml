name: Official candidate focused test

on:
  push:
    branches:
      - ai-learning-system
    paths:
      - '新システム開発/src/official-runtime-dependencies.js'
      - '新システム開発/src/official-runtime-dependencies.test.js'
      - '新システム開発/src/pinned-on-demand-candidates.js'
      - '新システム開発/src/pinned-on-demand-candidates.test.js'
      - '新システム開発/tools/verify-pinned-takken-pdf.mjs'
      - '新システム開発/tools/extract-takken-on-demand.py'
      - '新システム開発/src/official-pdf-pins.js'
      - '.github/workflows/official-candidate-focused-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show tested commit
        run: git rev-parse HEAD
      - name: Run six official candidate dependency tests
        working-directory: 新システム開発
        run: node --test src/official-runtime-dependencies.test.js src/pinned-on-demand-candidates.test.js
      - name: Download and verify real official Takken 2025 PDF
        working-directory: 新システム開発
        run: node tools/verify-pinned-takken-pdf.mjs
      - name: Extract real Takken question 29 from verified PDF
        working-directory: 新システム開発
        run: |
          python -m pip install --quiet PyMuPDF==1.26.5
          python tools/extract-takken-on-demand.py "$RUNNER_TEMP/takken-2025-verified.pdf" 29 > "$RUNNER_TEMP/takken-q29.json"
          python - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "takken-q29.json")
          with open(path, encoding="utf-8") as f:
              d = json.load(f)
          report = {k: d.get(k) for k in ("questionNumber", "choicesParsed", "status", "pdfPage", "rasterImagesOnPage", "vectorDrawingsOnPage")}
          report["choiceCount"] = len(d.get("choices") or [])
          report["stemPresent"] = bool(d.get("stem"))
          print("EXTRACTION_DIAGNOSTICS=" + json.dumps(report, ensure_ascii=False), flush=True)
          checks = {"questionNumber": d.get("questionNumber") == 29, "choicesParsed": d.get("choicesParsed") is True, "choiceCount": report["choiceCount"] == 4, "stemPresent": report["stemPresent"]}
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              print("EXTRACTION_VALIDATION_FAILED=" + ",".join(failed), file=sys.stderr)
              sys.exit(1)
          print("EXTRACTION_VALIDATION_PASSED")
          PY
