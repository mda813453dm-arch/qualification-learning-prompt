name: Official runtime generic tests
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/src/official-source-resolver.js'
      - '新システム開発/src/official-source-resolver.test.mjs'
      - '新システム開発/src/official-source-adapter-contract.js'
      - '新システム開発/src/official-source-adapter-contract.test.mjs'
      - '新システム開発/src/verified-source-copy-store.js'
      - '新システム開発/src/verified-source-copy-store.test.mjs'
      - '新システム開発/src/question-extraction-gate.js'
      - '新システム開発/src/question-extraction-gate.test.mjs'
      - '新システム開発/src/generic-pdf-question-segmenter.js'
      - '新システム開発/src/generic-pdf-question-segmenter.test.mjs'
      - '新システム開発/src/pdfjs-page-text-extractor.js'
      - '新システム開発/src/pdfjs-page-text-extractor.test.mjs'
      - '新システム開発/src/pdf-question-candidate-pipeline.js'
      - '新システム開発/src/official-pdf-runtime-ingestion.js'
      - '新システム開発/data/official-source-copies/**'
      - '.github/workflows/official-runtime-generic-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generic-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-learning-system
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        working-directory: 新システム開発
        run: npm install --no-audit --no-fund
      - name: Test all-catalog official source resolution
        run: node "新システム開発/src/official-source-resolver.test.mjs"
      - name: Test qualification-neutral source adapter contract
        run: node "新システム開発/src/official-source-adapter-contract.test.mjs"
      - name: Test hash-verified source-copy fallback
        run: node "新システム開発/src/verified-source-copy-store.test.mjs"
      - name: Test PDF.js extraction guards
        run: node "新システム開発/src/pdfjs-page-text-extractor.test.mjs"
      - name: Test generic PDF question segmentation
        run: node "新システム開発/src/generic-pdf-question-segmenter.test.mjs"
      - name: Test question extraction promotion gate
        run: node "新システム開発/src/question-extraction-gate.test.mjs"
