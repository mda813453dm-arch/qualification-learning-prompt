name: 公式PDFの見出し探しを調べる（読み取りのみ）
# 合図：新システム開発/deploy/pdf-diagnose-request.txt に公式ページのURLを1行書いて push する。
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/pdf-diagnose-request.txt'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pymupdf==1.24.10
      - name: ページごとの文字と見出し
        run: |
          python - <<'PY'
          import re, unicodedata, urllib.request, fitz
          page = open('新システム開発/deploy/pdf-diagnose-request.txt').read().split()[0]
          html = urllib.request.urlopen(page).read().decode('utf-8', 'ignore')
          links = sorted(set(re.findall(r'href="([^"]+\.pdf)"', html)))
          for l in links:
              url = l if l.startswith('http') else 'https://www.moj.go.jp' + l
              data = urllib.request.urlopen(url).read()
              doc = fitz.open(stream=data, filetype='pdf')
              print('=' * 10, url, 'pages', doc.page_count)
              for i in range(doc.page_count):
                  t = doc[i].get_text()
                  lines = [x.strip() for x in t.splitlines() if x.strip()]
                  heads = [x for x in lines if re.match(r'^[〔【\[（(]?\s*(第\s*[0-9０-９]+\s*問|問\s*[0-9０-９]+)', unicodedata.normalize('NFKC', x))]
                  print(f'p{i+1} chars={len(t)} imgs={len(doc[i].get_images())} heads={heads[:6]} first={lines[:3]}')
          PY
