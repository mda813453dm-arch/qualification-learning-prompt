name: 宅建残区分の公式50問を全員共通保存
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/takken-remaining-verified-import-request.txt'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    strategy:
      fail-fast: false
      matrix:
        file-index: [4, 5, 6]
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
      QLP_IMPORT_ENV: official-shared-only
      QLP_IMPORT_APPROVED: YES
    steps:
      - uses: actions/checkout@v4
      - name: 対象区分の明示承認を検査
        run: |
          grep -qx 'APPROVE_TAKKEN_VERIFIED_2020_OCT_DEC_2021_OCT_IMPORT' 新システム開発/deploy/takken-remaining-verified-import-request.txt
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 日本語OCRを準備
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr-jpn
      - run: python -m pip install -r 新システム開発/parser/requirements.txt
      - run: npm ci --prefix 新システム開発/engine
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: 原本・50問・公式正答・図を検証して共通登録
        run: node 新システム開発/engine/scripts/seed-official-takken-batch.mjs ${{ matrix.file-index }} --commit
