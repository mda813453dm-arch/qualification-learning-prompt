name: 公式PDFを取ってきて調べられるように置く（読み取りのみ）
# 合図：新システム開発/deploy/fetch-pdf-request.txt に「surveyor 2024」のように資格と年度を書いて push する。
# 結果は diag-pdfs ブランチに置く（掲載ページのHTMLと、その年度の問題・正答PDF）。
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/fetch-pdf-request.txt'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 掲載ページから探して取ってくる
        run: |
          mkdir -p out
          cat > /tmp/get.py <<'PY'
          import ssl, sys, urllib.request
          ctx = ssl.create_default_context()
          ctx.options |= 0x4  # 国土地理院は古い再ネゴシエーションを使う（OP_LEGACY_SERVER_CONNECT）
          req = urllib.request.Request(sys.argv[1], headers={'user-agent': 'qualification-learning-system'})
          open(sys.argv[2], 'wb').write(urllib.request.urlopen(req, context=ctx).read())
          PY
          read slug years < 新システム開発/deploy/fetch-pdf-request.txt
          url=$(cd 新システム開発/engine && node --input-type=module -e "import { LISTINGS } from './src/discover.js'; console.log(LISTINGS['$slug'].url)")
          python3 /tmp/get.py "$url" out/listing.html
          cd 新システム開発/engine && node --input-type=module -e "
          import fs from 'node:fs';
          import { LISTINGS, pdfLinks } from './src/discover.js';
          const l = LISTINGS['$slug'];
          const html = fs.readFileSync('../../out/listing.html', 'utf8');
          const all = l.sources(pdfLinks(html, l.url), 99);
          fs.writeFileSync('../../out/sources.json', JSON.stringify(all, null, 1));
          const want = '$years'.split(',').map(Number);
          for (const s of all.filter((x) => want.includes(x.year))) for (const u of [...(s.questionUrls ?? [s.questionUrl]), s.answerUrl].filter(Boolean)) console.log(s.year + ' ' + u);
          " > /tmp/list.txt
          cat /tmp/list.txt
          while read y u; do python3 /tmp/get.py "$u" "../../out/$y-$(basename $u)"; done < /tmp/list.txt
          ls -la ../../out
      - name: 結果を diag-pdfs に置く
        run: |
          cd out
          git init -q -b diag-pdfs
          git config user.name diag; git config user.email diag@example.invalid
          git add -A; git commit -qm "official pdfs"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-pdfs
