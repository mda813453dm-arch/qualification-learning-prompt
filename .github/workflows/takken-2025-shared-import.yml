name: 宅建2025公式50問の共有保存（明示承認済み）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/takken-2025-import-request.txt'
permissions:
  contents: read
concurrency:
  group: qlp-takken-2025-shared-import
  cancel-in-progress: false
jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
      QLP_IMPORT_ENV: official-shared-only
    steps:
      - uses: actions/checkout@v4
      - name: 承認対象の50問だけを厳密に確認
        shell: bash
        run: |
          if ! grep -qx 'APPROVE_TAKKEN_2025_50_OFFICIAL_SHARED_IMPORT' 新システム開発/deploy/takken-2025-import-request.txt; then
            echo '承認済み対象の一致を確認できないため、書き込みを行いません。'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -r 新システム開発/parser/requirements.txt
      - run: npm ci --prefix 新システム開発/engine
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: 公式原本・正答50問を全検証後に共有保存する
        env:
          QLP_IMPORT_APPROVED: YES
        run: node 新システム開発/engine/scripts/seed-official-takken-2025.mjs --commit
