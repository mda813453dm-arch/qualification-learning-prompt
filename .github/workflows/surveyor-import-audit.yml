name: 測量士補取り込み監査（読取専用）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/surveyor-audit-request.txt'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: npm ci --prefix 新システム開発/engine
      - name: 問題番号と除外理由・SHAだけを確認（本文や個人情報は表示しない）
        working-directory: 新システム開発/engine
        env:
          IMPORT_JOB_KEY: q063~2r7kqfjmiq
        run: |
          node --input-type=module <<'JS'
          import {GcpStore} from './src/gcp-store.js';
          import {readJob} from './src/ingest.js';
          import {readResult,readFigure} from './src/cache.js';
          import {officialLibrary} from './src/official-library.js';
          import {CATALOG} from './src/catalog.js';
          const store = new GcpStore({bucket:'qualification-learning-qlp-figures'});
          const job = await readJob(store,process.env.IMPORT_JOB_KEY);
          if (!job) throw new Error('IMPORT_JOB_NOT_FOUND');
          for (const s of job.sources || []) {
            const key = s.keyParts;
            const found = key ? await readResult(store,key,Date.now()) : {};
            const result = found.result || {};
            console.log(JSON.stringify({
              year:s.year,section:s.section,status:s.status,
              packetCount:result.packetCount,questionSha256:key?.questionSha256,
              answerSha256:key?.answerSha256,parserVersion:key?.parserVersion,
              excluded:result.excluded?.map(({questionNumber,reason})=>({questionNumber,reason}))||[]
            }));
            if (s.year === 2026 && found.hit) {
              const packets = result.packets || [];
              const names = [...new Set(packets.flatMap(p=>(p.figures||[]).flatMap(f=>f.svgFile?[f.file,f.svgFile]:[f.file])))];
              const missingAssets = [];
              for (const f of names) {
                if (!(await readFigure(store,key.questionSha256,key.parserVersion,f,key.owner))) missingAssets.push(f);
              }
              console.log('R8_CACHE_DIAG',JSON.stringify({
                status:result.status,packetCount:packets.length,excluded:result.excluded?.length,
                ownerPresent:!!key.owner,assetCount:names.length,missingAssetCount:missingAssets.length,
                noFigure:packets.filter(p=>!p.figures?.length).map(p=>({
                  number:p.questionNumber,stemMode:p.stemMode,choiceMode:p.choiceMode,
                  visual:p.verification?.visual,diagramRequired:p.diagramRequired,
                })),
              }));
            }
          }
          const lib = await officialLibrary(store,CATALOG.surveyor,'0.8.2',Date.now());
          console.log('CURRENT_SHARED',JSON.stringify({stored:lib.stored,missing:lib.missing,totalQuestions:lib.totalQuestions}));
          JS
