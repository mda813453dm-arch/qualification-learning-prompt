name: ITパスポートR8原本ローカル解析診断
on:
  push:
    branches: [ai-learning-system]
    paths: ['.github/workflows/itpass-local-parse-diagnostic.yml']
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Japanese OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr-jpn
          python -m pip install -r 新システム開発/parser/requirements.txt
      - name: 令和8年度100問の完全解析を原本から確認
        env:
          PYTHONPATH: 新システム開発/parser
        run: |
          gcloud storage cp 'gs://qualification-learning-qlp-figures/staging/itpass-20261022/16934af1ab515dac8756da05c7d80dec7d25afbe26bd1a20ebdf4b545922ab2e.pdf' /tmp/ip-question.pdf
          gcloud storage cp 'gs://qualification-learning-qlp-figures/staging/itpass-20261022/d90ff38528d7911b94a207e5a2ba31a51d8f206b827377f1f5c8cd5b76a6f4f0.pdf' /tmp/ip-answer.pdf
          python -m qlp_parser.cli --adapter itpass --year 2026 --section 公開問題 --question-pdf /tmp/ip-question.pdf --question-sha256 '16934af1ab515dac8756da05c7d80dec7d25afbe26bd1a20ebdf4b545922ab2e' --answer-pdf /tmp/ip-answer.pdf --answer-sha256 'd90ff38528d7911b94a207e5a2ba31a51d8f206b827377f1f5c8cd5b76a6f4f0' --assets-dir /tmp/ip-assets > /tmp/ip-result.json
          python -c 'import json;d=json.load(open("/tmp/ip-result.json"));print("LOCAL_IP_R8",json.dumps({"status":d.get("status"),"reason":d.get("reason"),"packetCount":d.get("packetCount"),"excluded":d.get("excluded"),"figures":sum(len(p.get("figures",[])) for p in d.get("packets",[]))},ensure_ascii=False))'
