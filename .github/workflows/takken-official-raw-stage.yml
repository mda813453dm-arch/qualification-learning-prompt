name: 宅建2016-2025公式12原本を共有保存（明示承認）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/takken-all-raw-stage-request.txt'
permissions:
  contents: read
concurrency:
  group: qlp-takken-all-raw-stage
  cancel-in-progress: false
jobs:
  stage-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
      QLP_IMPORT_ENV: official-shared-only
      QLP_IMPORT_APPROVED: YES
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 一括保存の明示承認と対象を確認
        shell: bash
        run: |
          if ! grep -qx 'APPROVE_TAKKEN_ALL_12_OFFICIAL_RAW_STAGE' 新システム開発/deploy/takken-all-raw-stage-request.txt; then
            echo '承認対象が一致しません。共有保存を停止します。'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --prefix 新システム開発/engine
      - run: node 新システム開発/engine/scripts/stage-takken-uploads.mjs --check-manifest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: 公式PDF12本のSHA照合、共通保存、保存後の再照合
        run: node 新システム開発/engine/scripts/stage-takken-uploads.mjs --commit
