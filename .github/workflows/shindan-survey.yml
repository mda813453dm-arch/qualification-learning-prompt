name: 中小企業診断士の公式過去問を試しに分解する（開発用・読み取りのみ）
# 合図：新システム開発/parser/tools/shindan_check.py か新システム開発/deploy/shindan-survey-request.txt を更新して push する。
# request.txt の最後の行に年度（西暦）を空白区切りで書くと、その年度を分解する。
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/parser/tools/shindan_check.py'
      - '新システム開発/parser/qlp_parser/adapters/shindan.py'
      - '新システム開発/deploy/shindan-survey-request.txt'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r 新システム開発/parser/requirements.txt
      - run: python 新システム開発/parser/tools/shindan_check.py $(tail -n 1 新システム開発/deploy/shindan-survey-request.txt 2>/dev/null | grep -oE '\b20[0-9]{2}\b' || true)
