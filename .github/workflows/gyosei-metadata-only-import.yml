name: 行政書士6年度360問の4項目メタデータ登録
on:
  push:
    branches: [ai-learning-system]
    paths: ['新システム開発/deploy/gyosei-metadata-import-request.txt']
permissions:
  contents: read
concurrency:
  group: qlp-gyosei-metadata-only
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024, 2025]
    env:
      GOOGLE_CLOUD_PROJECT: qualification-learning
      QLP_METADATA_ENV: gyosei-metadata-only
      QLP_METADATA_APPROVED: YES
    steps:
      - uses: actions/checkout@v4
      - name: Validate user's metadata-only registration instruction
        run: grep -qx 'APPROVE_GYOSEI_2020_2025_METADATA_ONLY_NO_QUESTION_TEXT' 新システム開発/deploy/gyosei-metadata-import-request.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Cloud store dependencies
        run: npm ci --prefix 新システム開発/engine
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Discard PDFs, keep only four fields and verify production readback
        run: node 新システム開発/engine/scripts/seed-gyosei-metadata.mjs ${{ matrix.year }} --commit
