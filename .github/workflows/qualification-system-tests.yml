name: qualification-system-tests
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/src/**'
      - '.github/workflows/qualification-system-tests.yml'
  workflow_dispatch:
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every qualification system test
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' testfile; do
            echo "::group::$testfile"
            node "$testfile"
            echo "::endgroup::"
            count=$((count+1))
          done < <(find "新システム開発/src" -maxdepth 1 -name '*.test.js' -print0 | sort -z)
          test "$count" -gt 0
          echo "Executed $count test files."
