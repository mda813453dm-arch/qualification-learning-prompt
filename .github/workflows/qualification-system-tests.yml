name: qualification-system-tests
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/src/**'
      - '新システム開発/tests/**'
      - '新システム開発/integration/**'
      - '新システム開発/package.json'
      - '新システム開発/package-lock.json'
      - '.github/workflows/qualification-system-tests.yml'
  workflow_dispatch:
jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install qualification system Node dependencies
        run: npm install --no-audit --no-fund
        working-directory: 新システム開発
      - name: Install integration test dependency
        run: python -m pip install PyMuPDF
      - name: Run every integration Python test
        run: python -m unittest discover -s "新システム開発/integration" -p 'test_*.py' -v
      - name: Run all JavaScript tests with unified TAP accounting
        run: npm test
        working-directory: 新システム開発
