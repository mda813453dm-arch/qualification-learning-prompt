name: 土地家屋調査士 旧年度共通問題庫の検証（Cloud Run再配置なし）
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/deploy/seed-land-surveyor-archive.mjs'
      - '.github/workflows/verify-land-surveyor-shared.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 新版の公開を待ってから共有問題庫を照合する
        run: |
          QLP_BASE_URL="$(gcloud run services describe qlp-engine --project qualification-learning --region asia-northeast1 --format='value(status.url)')"
          for attempt in {1..24}; do
            current="$(curl --fail --silent --show-error --max-time 20 "$QLP_BASE_URL/v1/release" || true)"
            if RELEASE_JSON="$current" node -e 'try { if (JSON.parse(process.env.RELEASE_JSON).build === "2026-10-31-v149-land-surveyor-archive") process.exit(0); } catch {} process.exit(1)' ; then
              echo 'Verified v149 engine is now public'
              exit 0
            fi
            echo "Waiting for v149 engine deployment ($attempt/24)"
            sleep 30
          done
          echo 'v149 engine did not become public within 12 minutes' >&2
          exit 1
      - name: 検証済み14区分のみ共通問題庫の状態を照合（既存の他年度を保持）
        run: |
          export QLP_BASE_URL="$(gcloud run services describe qlp-engine --project qualification-learning --region asia-northeast1 --format='value(status.url)')"
          export QLP_TEST_TOKEN="$(gcloud secrets versions access latest --secret qlp-api-token --project qualification-learning)"
          node 新システム開発/deploy/seed-land-surveyor-archive.mjs
