name: 測量士補公式PDF図表取得
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/integration/gsi_ci_visual_pipeline.py'
      - '新システム開発/integration/test_gsi_ci_visual_pipeline.py'
      - '新システム開発/integration/offline_survey_visual.py'
      - '新システム開発/integration/test_offline_survey_visual.py'
      - '.github/workflows/gsi-surveyor-visual-evidence.yml'
  workflow_dispatch:
jobs:
  render-official-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PDF画像化ライブラリ
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: 取得・検証処理の単体テスト
        run: |
          python -m unittest discover -s 新システム開発/integration -p 'test_gsi_ci_visual_pipeline.py' -v
          python -m unittest discover -s 新システム開発/integration -p 'test_offline_survey_visual.py' -v
      - name: 公式PDFを取得して第7問・第27問を画像化
        id: official_pdf
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p visual-evidence
          set -o pipefail
          python 新システム開発/integration/gsi_ci_visual_pipeline.py visual-evidence 2>&1 | tee visual-evidence/fetch-log.txt
      - name: 取得結果の記録
        if: always()
        shell: bash
        env:
          FETCH_OUTCOME: ${{ steps.official_pdf.outcome }}
        run: |
          mkdir -p visual-evidence
          printf 'official_pdf_step=%s\n' "$FETCH_OUTCOME" > visual-evidence/status.txt
      - name: 公式PDF取得に失敗した場合はジョブを失敗扱い
        if: steps.official_pdf.outcome == 'failure'
        run: exit 1
      - name: 検証用画像とハッシュ記録を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-assistant-2026-visual-evidence
          path: visual-evidence/
          retention-days: 7
