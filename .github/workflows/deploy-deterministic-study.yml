name: Deterministic Mobile Study - Tests and Pages
on:
  push:
    branches: [ai-learning-system]
    paths:
      - '新システム開発/web-study/**'
      - '新システム開発/data/runtime-packets/**'
      - '.github/workflows/deploy-deterministic-study.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deterministic-study
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deterministic state machine and real static packets
        working-directory: 新システム開発
        run: node --test web-study/engine.test.mjs
      - name: Download official image copies and verify SHA-256
        working-directory: 新システム開発
        run: node web-study/verify-live-assets.mjs
      - name: Install browser test dependencies
        run: |
          python -m pip install --quiet Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Exercise mobile-sized browser UI with mocked verified fixture
        working-directory: 新システム開発
        run: python web-study/browser-offline-test.py
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 新システム開発/web-study
      - id: deployment
        uses: actions/deploy-pages@v4